[project]
name = "kundeavissok"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ask", email = "askhf@ntnu.no" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.30.1",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "paramiko>=5.0.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "selenium>=4.51.0",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
kundeavissok = "kundeavissok:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
